name: OffloadPro v4.4 - Pure PowerShell, TDD & DevSecOps CI Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  ci-windows-gate:
    name: Windows PowerShell 5.1 & 7+ TDD & Privacy Verification
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 1. Zero-Node.js & Privacy Guardrail Gate (Zero Regex)
        shell: pwsh
        run: |
          $forbiddenFiles = @('server.js', 'package.json', 'package-lock.json', '.offloadpro.local.json')
          foreach ($f in $forbiddenFiles) {
            if (Test-Path -LiteralPath $f) {
              Write-Error "CI GATE FAILED: Retired or private file '$f' is present in repository."
              exit 1
            }
          }
          $leakedMhl = @(Get-ChildItem -Path . -Filter '*.mhl' -Recurse -File -ErrorAction SilentlyContinue)
          if ($leakedMhl.Count -gt 0) {
            Write-Error "CI GATE FAILED: Tracked .mhl manifest found in repository."
            exit 1
          }
          Write-Host "[OK] Zero-Node.js & Privacy Gate Passed." -ForegroundColor Green

      - name: 2. PowerShell AST Syntax & Static Validation (PS 7+ & Windows PS 5.1)
        shell: powershell
        run: |
          $codeFiles = @(Get-ChildItem -Path .\scripts, .\modules -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' })
          foreach ($s in $codeFiles) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Syntax error in $($s.Name): $($errors | Out-String)"
              exit 1
            }
            Write-Host "[OK] AST Verified (PS 5.1): $($s.Name)" -ForegroundColor Green
          }

      - name: 3. Execute 18-Invariant TDD & Mutation Test Suite (PowerShell 7+)
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\Invoke-TDDTestSuite.ps1

      - name: 4. Execute 18-Invariant TDD & Mutation Test Suite (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Invoke-TDDTestSuite.ps1

      - name: 5. Execute Maya Lin On-Set Feature Film Production Demo (PowerShell 7+)
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\Invoke-PersonaDemo.ps1

      - name: 6. Execute Maya Lin On-Set Feature Film Production Demo (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Invoke-PersonaDemo.ps1
